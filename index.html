<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Queens — Stayci & Di</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: #5c463d;
  padding: 24px 12px 50px;

  background-image:
  linear-gradient(
    rgba(255, 248, 244, 0.10),
    rgba(255, 248, 244, 0.10)
  ),
  url("background.PNG");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
    body::before {
  content: "";
  position: fixed;
  inset: -10px;

  background-image: url("background.PNG");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;

  filter: blur(4px);
  transform: scale(1.02);

  z-index: -1;
}

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .main-card {
      background: rgba(255, 250, 247, 0.88);

      border: 1px solid rgba(183, 143, 93, 0.35);
      border-radius: 38px;

      padding: 42px 22px 34px;

      box-shadow:
        0 20px 60px rgba(100, 70, 50, 0.12);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand {
      text-align: center;

      color: #a87836;

      font-size: clamp(31px, 7vw, 52px);
      font-weight: 700;

      line-height: 1.25;
    }

    .subtitle {
      text-align: center;

      color: #9a7a69;

      margin-top: 18px;

      font-size: 13px;
      letter-spacing: 3px;

      text-transform: uppercase;
      line-height: 1.7;
    }

    .divider {
      width: 42%;
      height: 1px;

      margin: 30px auto;

      background: linear-gradient(
        90deg,
        transparent,
        #c99c57,
        transparent
      );
    }

    .welcome {
      text-align: center;
      padding: 12px 8px 24px;
    }

    .welcome h1 {
      margin: 0 0 14px;

      color: #6b5145;

      font-size: clamp(24px, 5vw, 34px);
    }

    .welcome p {
      max-width: 520px;

      margin: 0 auto;

      color: #8a7165;

      font-size: 16px;
      line-height: 1.65;
    }

    .prompt-card {
      display: block;
position: relative;
overflow: hidden;
      margin-top: 18px;
      padding: 24px;

      background: rgba(255, 255, 255, 0.70);

      border: 1px solid rgba(191, 151, 94, 0.35);
      border-radius: 26px;

      color: #5c463d;
      text-decoration: none;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }
.prompt-card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -80%;
    width: 45%;
    height: 200%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 215, 140, 0.28),
        rgba(255, 255, 255, 0.55),
        rgba(255, 215, 140, 0.28),
        transparent
    );

    transform: rotate(18deg);
    transition: left 2.4s ease-in-out;
    pointer-events: none;
}

.prompt-card:hover::before {
    left: 135%;
}
    .prompt-card:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(100, 70, 50, 0.10);
    }
.prompt-image {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  display: block;
  border-radius: 18px;
  margin-bottom: 18px;
  box-shadow: 0 10px 28px rgba(92, 70, 61, 0.12);
  transition: transform 1.2s ease, filter 1.2s ease;
}

.prompt-card:hover .prompt-image {
  transform: scale(1.02);
  filter: brightness(1.03);
}
    .prompt-number {
      color: #b08242;

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 2px;

      margin-bottom: 10px;
    }

    .prompt-title {
      font-size: 20px;
      font-weight: 700;

      line-height: 1.35;
    }

    .open {
      margin-top: 15px;

      color: #a87836;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 0.5px;
    }

    .footer {
      text-align: center;

      margin-top: 30px;

      color: #a58c7e;

      font-size: 12px;
    }

    @media (max-width: 600px) {

      body {
        padding: 12px 8px 35px;
      }

      .main-card {
        border-radius: 30px;
        padding: 34px 16px 28px;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <section class="main-card">

      <div class="brand">

        𝓐𝓘 𝓠𝓾𝓮𝓮𝓷𝓼 👑
        <br>
        𝓢𝓽𝓪𝔂𝓬𝓲 &amp; 𝓓𝓲

      </div>


      <div class="subtitle">

        Official Prompt Collection

      </div>


      <div class="divider"></div>


      <div class="welcome">

        <h1>
          Prompt Library
        </h1>

        <p>
          Our exclusive collection of AI prompts.
          Choose a prompt, open it,
          and copy it with one click.
        </p>

      </div>


      <a
        class="prompt-card"
        href="/p/001/"
      >
<img
  class="prompt-image"
  src="prompt-001.png"
  alt="Cinematic Automotive Fashion"
/>
        <div class="prompt-number">

          PROMPT #001

        </div>


        <div class="prompt-title">

          Cinematic Automotive Fashion

        </div>


        <div class="open">

          VIEW PROMPT →

        </div>

      </a>
<a
  class="prompt-card"
  href="/p/002/"
>
<img
  class="prompt-image"
  src="prompt-002.png"
  alt="Ruby Rain Luxury Editorial"
/>
  <div class="prompt-number">
    PROMPT #002
  </div>

  <div class="prompt-title">
    Ruby Rain Luxury Editorial
  </div>

  <div class="open">
    VIEW PROMPT →
  </div>

</a>

      <div class="footer">

        © AI Queens — Stayci &amp; Di

      </div>

    </section>

  </main>

</body>

</html>

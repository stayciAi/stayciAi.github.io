<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Queens — Stayci & Di</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family: Arial, Helvetica, sans-serif;
      color: #5c463d;

      padding: 24px 12px 50px;

      background: #f8eee8;

      position: relative;
    }

    body::before {
      content: "";

      position: fixed;
      inset: -10px;

      background-image: url("background.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;

      filter: blur(1px);
      transform: scale(1.01);

      z-index: -1;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .main-card {
      background: rgba(255, 250, 247, 0.88);

      border: 1px solid rgba(183, 143, 93, 0.35);
      border-radius: 38px;

      padding: 42px 22px 34px;

      box-shadow:
        0 24px 70px rgba(100, 70, 50, 0.14),
        0 0 35px rgba(191, 151, 94, 0.10);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand {
      text-align: center;

      color: #a87836;

      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;

      font-size: clamp(24px, 4vw, 42px);

      white-space: nowrap;

      font-weight: 700;
      line-height: 1.25;
    }

    .subtitle {
      text-align: center;

      color: #9a7a69;

      margin-top: 18px;

      font-size: 13px;
      letter-spacing: 3px;

      text-transform: uppercase;
      line-height: 1.7;
    }

    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 12px;

      margin-top: 14px;
    }

    .social-btn {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(168, 120, 54, 0.45);
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.55);
      color: #a87836;

      text-decoration: none;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .social-btn:hover {
      transform: translateY(-2px);

      background: rgba(255, 248, 235, 0.95);

      box-shadow:
        0 6px 18px rgba(168, 120, 54, 0.20);
    }

    .divider {
      width: 42%;
      height: 1px;

      margin: 30px auto;

      background: linear-gradient(
        90deg,
        transparent,
        #c99c57,
        transparent
      );
    }

    .welcome {
      text-align: center;

      padding: 12px 8px 24px;
    }

    .welcome h1 {
      margin: 0 0 14px;

      color: #6b5145;

      font-size: clamp(24px, 5vw, 34px);
    }

    .welcome p {
      max-width: 520px;

      margin: 0 auto;

      color: #8a7165;

      font-size: 16px;
      line-height: 1.65;
    }

    .prompt-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 18px;

      align-items: start;
    }

    .prompt-card {
      display: block;

      position: relative;
      overflow: hidden;

      padding: 24px;

      background: rgba(255, 255, 255, 0.70);

      border: 1px solid rgba(191, 151, 94, 0.35);
      border-radius: 26px;

      color: #5c463d;
      text-decoration: none;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .prompt-card::before {
      content: "";

      position: absolute;

      top: -50%;
      left: -80%;

      width: 45%;
      height: 200%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 215, 140, 0.28),
        rgba(255, 255, 255, 0.55),
        rgba(255, 215, 140, 0.28),
        transparent
      );

      transform: rotate(18deg);

      transition: left 2.4s ease-in-out;

      pointer-events: none;
    }

    .prompt-card:hover::before {
      left: 135%;
    }

    .prompt-card:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(100, 70, 50, 0.10);
    }

    .prompt-image {
      width: 100%;

      aspect-ratio: 4 / 5;

      object-fit: cover;
      object-position: center center;

      display: block;

      border-radius: 18px;

      margin-bottom: 18px;

      box-shadow:
        0 10px 28px rgba(92, 70, 61, 0.12);

      transition:
        transform 1.2s ease,
        filter 1.2s ease;
    }

    .prompt-image.position-top {
      object-position: center top;
    }

    .prompt-card:hover .prompt-image {
      transform: scale(1.02);
      filter: brightness(1.03);
    }

    .prompt-number {
      color: #b08242;

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 2px;

      margin-bottom: 10px;
    }

    .prompt-title {
      font-size: 20px;
      font-weight: 700;

      line-height: 1.35;
    }

    .open {
      margin-top: 15px;

      color: #a87836;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 0.5px;
    }

    .empty-message {
      grid-column: 1 / -1;

      text-align: center;

      padding: 30px 10px;

      color: #8a7165;

      font-size: 15px;
    }

    .footer {
      text-align: center;

      margin-top: 30px;

      color: #a58c7e;

      font-size: 12px;
    }

    @media (max-width: 700px) {
      .prompt-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 8px 35px;
      }

      .main-card {
        border-radius: 30px;

        padding: 34px 16px 28px;
      }
    }
  </style>

</head>


<body>

  <main class="page">

    <section class="main-card">

      <div class="brand">
        AI Queens ♛ Stayci &amp; Di
      </div>

      <div class="subtitle">
        Official Prompt Collection
      </div>


      <div class="social-links">

        <a
          href="https://www.instagram.com/_stayci_ai_/"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>


        <a
          href="https://t.me/stayci_ai"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Telegram"
        >
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="currentColor"
          >
            <path d="M21.7 3.3 18.5 20c-.2 1.2-.9 1.5-1.8.9l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.1 13.8 1.3 12.3c-1-.3-1-1 .2-1.5L20.2 3.6c.9-.3 1.7.2 1.5-.3z"></path>
          </svg>
        </a>


        <a
          href="https://www.pinterest.com/stayci_di/"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Pinterest"
        >
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="currentColor"
          >
            <path d="M12 2a10 10 0 0 0-3.6 19.3c-.1-1.6 0-3.5.4-5.2l1.3-5.4s-.3-.7-.3-1.8c0-1.7 1-3 2.2-3 1 0 1.5.8 1.5 1.8 0 1.1-.7 2.7-1 4.2-.6 1.8.9 3.3 2.6 3.3 3.1 0 5.2-4 5.2-8.7 0-3.6-2.9-6.4-7.2-6.4-5.2 0-8.4 3.9-8.4 8.2 0 1.5.4 3 1.3 3.8.1.2.2.3.1.6l-.4 1.5c-.1.5-.5.6-.9.4-2.4-1-3.5-3.7-3.5-6.7C1.3 3.6 5 0 12.4 0 18.4 0 22.3 4.4 22.3 9.2c0 6.3-3.5 11-8.6 11-1.7 0-3.3-.9-3.8-1.9l-1 4c-.4 1.5-1.2 3-1.9 4A10 10 0 1 0 12 2z"></path>
          </svg>
        </a>

      </div>


      <div class="divider"></div>


      <div class="welcome">

        <h1>
          Prompt Library
        </h1>

        <p>
          Our exclusive collection of AI prompts.
          Choose a prompt, open it,
          and copy it with one click.
        </p>

      </div>


      <div
        class="prompt-grid"
        id="promptGrid"
      ></div>


      <div class="footer">
        © AI Queens — Stayci &amp; Di
      </div>

    </section>

  </main>


  <script src="prompts.js"></script>

  <script>

    const promptGrid =
      document.getElementById("promptGrid");


    if (!Array.isArray(prompts) || prompts.length === 0) {

      promptGrid.innerHTML = `
        <div class="empty-message">
          No prompts added yet.
        </div>
      `;

    } else {

      prompts.forEach(prompt => {

        const card =
          document.createElement("a");

        card.className =
          "prompt-card";

        card.href =
          `prompt.html?id=${encodeURIComponent(prompt.id)}`;


        const image =
          document.createElement("img");

        image.className =
          "prompt-image";

        if (prompt.imagePosition === "top") {
          image.classList.add("position-top");
        }

        image.src =
          prompt.image;

        image.alt =
          prompt.title;


        const number =
          document.createElement("div");

        number.className =
          "prompt-number";

        number.textContent =
          `PROMPT #${prompt.id}`;


        const title =
          document.createElement("div");

        title.className =
          "prompt-title";

        title.textContent =
          prompt.title;


        const open =
          document.createElement("div");

        open.className =
          "open";

        open.textContent =
          "VIEW PROMPT →";


        card.appendChild(image);
        card.appendChild(number);
        card.appendChild(title);
        card.appendChild(open);

        promptGrid.appendChild(card);

      });

    }

  </script>

</body>

</html>

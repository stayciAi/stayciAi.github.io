mpt-card:after{content:"";position:absolute;inset:-100% auto auto -65%;height:300%;width:38%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,#fff4ce40,transparent);transition:left .8s;pointer-events:none}.category:hover:after,.prompt-card:hover:after{left:130%}.category img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.category:hover img{transform:scale(1.035)}.category-label{position:absolute;bottom:0;left:0;right:0;padding:16px 19px;background:#080605e8;display:flex;align-items:center;justify-content:space-between;font:500 clamp(12px,1.65vw,19px) 'Cinzel',serif;color:#fff0cd;gap:8px}.category-label b{font:25px Georgia,serif}.library{padding-top:68px;scroll-margin-top:10px}.library-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.library h2{font:500 28px 'Cinzel',serif;letter-spacing:.08em;margin:0}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tools input,.tools button{background:#0d0907;border:1px solid #bb8746;color:#ffe4a9;border-radius:8px;padding:11px 14px;font:14px 'DM Sans',sans-serif}.tools input{width:min(270px,70vw)}.tools button{cursor:pointer}.count{font-size:13px;color:#d9b77f;margin:13px 0 22px}.prompt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.prompt-card{position:relative;display:block;overflow:hidden;border:1px solid #c99a55;border-radius:12px;background:#100c09;color:#f6dfb4;text-decoration:none;box-shadow:0 0 8px #ac651b66;transition:transform .25s,box-shadow .25s}.prompt-card:hover{transform:translateY(-3px);box-shadow:0 0 17px #d99d4c}.prompt-card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.prompt-info{padding:12px}.prompt-number{color:#cc9c58;font-size:11px;letter-spacing:.1em}.prompt-title{font:500 16px Georgia,serif;margin:7px 0}.view{font-size:11px;letter-spacing:.09em;color:#e5b775}.empty{grid-column:1/-1;text-align:center;padding:30px;color:#e0c59a}.footer{text-align:center;color:#b28c59;font-size:12px;margin-top:65px}@media(max-width:800px){.wrap{padding:22px 20px 70px}.hero{min-height:360px;padding-top:70px}.hero-copy{width:73%}.queen{width:52%;height:360px}.brand{font-size:clamp(36px,7vw,60px)}.prompt-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.wrap{padding:18px 13px 50px}.hero{min-height:410px;padding:33px 0 16px}.hero-copy{width:100%}.queen{width:73%;height:260px;top:5px;opacity:.65}.eyebrow{position:relative;font-size:12px;letter-spacing:.19em}.brand{position:relative;font-size:clamp(31px,9vw,50px);white-space:normal;max-width:85%;margin-top:110px}.tagline{position:relative;font-size:21px;margin:14px 0 20px}.social{gap:8px}.social a,.social button{padding:11px 12px;font-size:13px}.section-heading{font-size:14px;letter-spacing:.15em;gap:8px;margin:18px 0}.categories{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.category{border-radius:11px}.category-label{padding:10px 8px;font-size:10px}.category-label b{font-size:18px}.library{padding-top:42px}.prompt-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.prompt-title{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

<body><main class="wrap">
<header class="hero"><div class="queen" role="img" aria-label="Stayci wearing a golden crown"></div><div class="hero-copy"><p class="eyebrow">PROMPT COLLECTION</p><h1 class="brand">STAYCI AI QUEEN</h1><p class="tagline"><span>✦</span> Where Imagination Becomes Art <span>✦</span></p>
<div class="social"><div class="instagram"><button type="button" id="instagramButton" aria-expanded="false" aria-controls="instagramMenu"><span class="symbol">◎</span> Instagram ⌄</button><div class="dropdown" id="instagramMenu"><a href="https://www.instagram.com/__stayci__/" target="_blank" rel="noopener noreferrer">Personal Instagram ↗</a><a href="https://www.instagram.com/_stayci_ai_/" target="_blank" rel="noopener noreferrer">AI Prompts Instagram ↗</a></div></div><a href="https://t.me/stayci_ai" target="_blank" rel="noopener noreferrer"><span class="symbol">➤</span> Telegram ↗</a><a href="https://www.pinterest.com/stayci_ai/" target="_blank" rel="noopener noreferrer"><span class="symbol">Ⓟ</span> Pinterest ↗</a></div></div></header>
<h2 class="section-heading">EXPLORE PROMPTS</h2><nav class="categories" aria-label="Prompt categories">
<a class="category" href="#library" data-category="woman"><img alt="Woman prompts" loading="lazy"><span class="category-label">WOMAN PROMPTS <b>→</b></span></a>
<a class="category" href="#library" data-category="man"><img alt="Man prompts" loading="lazy"><span class="category-label">MAN PROMPTS <b>→</b></span></a>
<a class="category" href="#library" data-category="couple"><img alt="Couple prompts" loading="lazy"><span class="category-label">COUPLE PROMPTS <b>→</b></span></a>



<a class="category" href="#library" data-category="holiday"><img alt="Holiday prompts" loading="lazy"><span class="category-label">HOLIDAY PROMPTS <b>→</b></span></a>
</nav>
<section class="library" id="library"><div class="library-header"><h2 id="libraryTitle">ALL PROMPTS</h2><div class="tools"><input type="search" id="search" placeholder="Search prompts..." aria-label="Search prompts"><button id="showAll" type="button">All prompts</button></div></div><p class="count" id="count"></p><div class="prompt-grid" id="promptGrid"></div></section>
<footer class="footer">© STAYCI AI QUEEN · Where Imagination Becomes Art</footer></main>
<script src="prompts.js"></script>
<script>
const grid=document.getElementById('promptGrid'), count=document.getElementById('count'), search=document.getElementById('search'), title=document.getElementById('libraryTitle');
const all=typeof prompts!=='undefined'&&Array.isArray(prompts)?prompts:[];let category='';
// Explicit editorial categories. Holiday prompts may also appear under Woman or Couple.
const categoryIds={
 woman:new Set(['001','002','003','004','005','008','009','010','012','013','014','015','016','017','018','024','027','030','031','032','033','034','035','041','042','043',...Array.from({length:19},(_,i)=>String(i+44).padStart(3,'0'))]),
 man:new Set(['019','020','021','022','023']),
 couple:new Set(['006','007','011','025','026','028','029','036','037','038','039','040',...Array.from({length:6},(_,i)=>String(i+63).padStart(3,'0'))]),
 holiday:new Set(Array.from({length:25},(_,i)=>String(i+44).padStart(3,'0')))
};
function match(p,c){return !c || Boolean(categoryIds[c]?.has(String(p.id).padStart(3,'0')));}
function render(){const q=search.value.trim().toLowerCase();const filtered=all.filter(p=>match(p,category)&&(!q||`${p.title||''} ${p.id||''}`.toLowerCase().includes(q)));grid.replaceChildren();count.textContent=`${filtered.length} of ${all.length} prompts`;
if(!filtered.length){const m=document.createElement('p');m.className='empty';m.textContent=category?'No matching prompts found. Choose “All prompts” to see the full collection.':'No prompts found.';grid.append(m);return;}
for(const p of filtered){const a=document.createElement('a');a.className='prompt-card';a.href='prompt.html?id='+encodeURIComponent(p.id);const img=document.createElement('img');img.src=p.image;img.alt=p.title||'Prompt image';img.loading='lazy';if(p.imagePosition)img.style.objectPosition=p.imagePosition;const info=document.createElement('div');info.className='prompt-info';const n=document.createElement('div');n.className='prompt-number';n.textContent='PROMPT #'+p.id;const t=document.createElement('div');t.className='prompt-title';t.textContent=p.title||'Untitled prompt';const v=document.createElement('div');v.className='view';v.textContent='VIEW PROMPT →';info.append(n,t,v);a.append(img,info);grid.append(a);}}
// Category covers are drawn from the existing prompt collection; no extra category images required.
const cards=[...document.querySelectorAll('.category')];
const coverPicks={woman:[],man:[],couple:[],holiday:[]};
for(const p of all){for(const key of Object.keys(coverPicks)){if(match(p,key)&&p.image)coverPicks[key].push(p)}}
for(const card of cards){const key=card.dataset.category;const img=card.querySelector('img');const pick=coverPicks[key][0] || all.find(p=>p.image);if(pick){img.src=pick.image;if(pick.imagePosition)img.style.objectPosition=pick.imagePosition;}else{img.style.display='none'}}
render();search.addEventListener('input',render);document.getElementById('showAll').addEventListener('click',()=>{category='';search.value='';title.textContent='ALL PROMPTS';render()});document.querySelectorAll('[data-category]').forEach(a=>a.addEventListener('click',()=>{category=a.dataset.category;search.value='';title.textContent=category.toUpperCase()+' PROMPTS';render()}));
const btn=document.getElementById('instagramButton'),menu=document.getElementById('instagramMenu');btn.addEventListener('click',()=>{const open=menu.classList.toggle('open');btn.setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.instagram')){menu.classList.remove('open');btn.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.classList.remove('open');btn.setAttribute('aria-expanded','false')}});
</script></body></html>
